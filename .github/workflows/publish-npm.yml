name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm 11 (Trusted Publishing needs 11.5.1 or newer)
        run: npm install -g npm@11

      - name: Syntax check the wrapper
        run: node --check bin/ownvoice.js
        working-directory: npm

      - name: Dry-run pack
        run: npm pack --dry-run
        working-directory: npm

      - name: Publish to npm
        run: npm publish --access public
        working-directory: npm
